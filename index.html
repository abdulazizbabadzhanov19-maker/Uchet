<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учёт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --sec:var(--tg-theme-secondary-bg-color,#eff1f4);
  --text:var(--tg-theme-text-color,#14171a);
  --hint:var(--tg-theme-hint-color,#8a9099);
  --accent:var(--tg-theme-button-color,#2f7de1);
  --line:color-mix(in srgb,var(--hint) 22%,transparent);
  --bad:#e5484d; --good:#2f9e66; --warn:#c98200;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sec);color:var(--text);
  font:16px/1.4 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:240px}
body.no-receipt{padding-bottom:40px}
header{padding:14px 16px 4px;display:flex;align-items:center;gap:8px}
.nav{border:0;background:var(--bg);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;flex:none}
.nav:disabled{opacity:.3}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dt{flex:1;text-align:center}
.dt b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em}
.dt span{font-size:13px;color:var(--hint)}
.status{text-align:center;font-size:12px;color:var(--hint);height:16px}
.tabs{display:flex;gap:4px;margin:8px 16px 12px;background:var(--bg);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;color:var(--hint);font:inherit;font-weight:600;padding:8px 4px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--sec);color:var(--text)}
.seg{margin-top:0}
.seg button{font-size:14px;padding:6px 4px}
.list{background:var(--bg);margin:0 16px;border-radius:14px;overflow:hidden}
.item{padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:600;overflow-wrap:anywhere}
.price{color:var(--hint);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.f label,.prow-fields label{display:block;font-size:12px;color:var(--hint);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input{width:100%;font:inherit;font-variant-numeric:tabular-nums;padding:8px 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--sec);color:var(--text);min-width:0}
input:focus-visible{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.ro{padding:8px 0;font-variant-numeric:tabular-nums}
.res{margin-top:8px;font-size:14px;color:var(--hint);font-variant-numeric:tabular-nums}
.res b{color:var(--text);font-weight:600}
.neg,.neg b{color:var(--bad)}
.empty{padding:22px 16px;text-align:center;color:var(--hint)}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:6px}
.h2{margin:18px 20px 8px;font-size:15px;font-weight:600}
.prow{padding:12px 14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow-top{display:flex;gap:8px;align-items:center}
.prow-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.erow{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.del{flex:none;width:36px;border:0;background:none;color:var(--hint);font-size:22px;line-height:1;cursor:pointer;border-radius:8px;height:36px}
.btnrow{display:flex;justify-content:space-between;margin:4px 12px}
.note{margin:10px 16px;font-size:13px;color:var(--hint)}
.receipt{position:fixed;left:0;right:0;bottom:0;background:var(--bg);
  padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px));
  filter:drop-shadow(0 -3px 8px rgba(0,0,0,.08))}
.receipt::before{content:"";position:absolute;left:0;right:0;top:-7px;height:7px;
  background:conic-gradient(from -45deg at bottom,var(--bg) 90deg,transparent 0) 50%/14px 100%}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.rrow+.rrow{margin-top:8px}
.rrow input{max-width:150px;text-align:right}
.rrow.sub{font-size:14px;color:var(--hint);margin-top:4px}
.total{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.total .lbl{font-weight:600}
.total .big{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.total.bad .big,.total.bad .lbl{color:var(--bad)}
.total.good .big,.total.good .lbl{color:var(--good)}
.total.warn .big,.total.warn .lbl{color:var(--warn)}
.total.wait .big{font-size:15px;font-weight:500;color:var(--hint)}
.miss{font-size:13px;color:var(--warn);margin-top:8px}
.loading{padding:40px;text-align:center;color:var(--hint)}
.rep-head{margin:0 20px 10px;font-weight:600}
.rep-item{padding:12px 14px;border-bottom:1px solid var(--line)}
.rep-item:last-child{border-bottom:0}
.rep-line{font-size:14px;color:var(--hint);margin-top:2px;font-variant-numeric:tabular-nums}
.rep-sum{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.card{background:var(--bg);margin:0 16px 12px;border-radius:14px;padding:14px}
.profit{color:var(--good)}
.share{display:flex;gap:8px;margin:12px 16px}
.share button{flex:1;padding:12px;border:0;border-radius:12px;background:var(--accent);color:var(--tg-theme-button-text-color,#fff);font:inherit;font-weight:600;cursor:pointer}
.share button.alt{background:var(--bg);color:var(--accent)}
</style>
</head>
<body>
<header>
  <button class="nav" id="prevBtn" aria-label="Предыдущий день">‹</button>
  <div class="dt"><b id="dateTitle">…</b><span id="dateSub"></span></div>
  <button class="nav" id="nextBtn" aria-label="Следующий день">›</button>
</header>
<div class="status" id="status" aria-live="polite"></div>

<div class="tabs" role="tablist">
  <button role="tab" id="tab-day" aria-selected="true">Остатки</button>
  <button role="tab" id="tab-rep" aria-selected="false">Отчёт</button>
  <button role="tab" id="tab-prod" aria-selected="false">Товары</button>
</div>

<section id="day">
  <div class="list" id="dayList"><div class="loading">Загрузка…</div></div>
  <div class="h2">Расходы за день</div>
  <div class="list" id="expList"></div>
  <div class="btnrow">
    <button class="linkbtn" id="addExp">+ Добавить расход</button>
    <button class="linkbtn" id="copyExp" hidden>Как вчера</button>
  </div>
</section>

<section id="rep" hidden>
  <div class="tabs seg" role="tablist" aria-label="Период">
    <button role="tab" data-p="day" aria-selected="true">День</button>
    <button role="tab" data-p="week" aria-selected="false">Неделя</button>
    <button role="tab" data-p="month" aria-selected="false">Месяц</button>
  </div>
  <div class="rep-head" id="repHead"></div>
  <div id="repBody"></div>
  <div class="share">
    <button id="shareBtn">Отправить в чат</button>
    <button class="alt" id="copyBtn">Скопировать</button>
  </div>
</section>

<section id="prod" hidden>
  <div class="list" id="prodList"></div>
  <div class="btnrow"><button class="linkbtn" id="addProd">+ Добавить товар</button></div>
  <p class="note">Цена и себестоимость — за 1 кг или 1 шт. «В пятницу» заполняйте только для товаров со скидкой. Себестоимость — сколько вы сами платите за товар, из неё считается прибыль. Изменения сохраняются сами.</p>
</section>

<div class="receipt" id="receipt">
  <div class="rrow"><span>Должно быть</span><b id="expected">0 сом</b></div>
  <div class="rrow"><label for="cash">В кассе по факту</label>
    <input id="cash" inputmode="decimal" placeholder="Сумма, сом" autocomplete="off"></div>
  <div class="total wait" id="total"><span class="lbl" id="diffLbl"></span><span class="big" id="diff">Введите сумму из кассы</span></div>
  <div class="miss" id="miss" hidden></div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = id => document.getElementById(id);

/* ---------- Хранилище: облако Telegram, иначе память телефона ---------- */
const CS = (tg && tg.initData && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) ? tg.CloudStorage : null;
const sGet = keys => new Promise(res => {
  if (!keys.length) return res({});
  if (CS) CS.getItems(keys, (e, v) => res(e ? {} : (v || {})));
  else { const o = {}; keys.forEach(k => { try { o[k] = localStorage.getItem(k) || ''; } catch(e) { o[k] = ''; } }); res(o); }
});
async function sGetMany(keys){ const out = {}; for (let i = 0; i < keys.length; i += 20) Object.assign(out, await sGet(keys.slice(i, i + 20))); return out; }
const sSet = (k, v) => new Promise((res, rej) => {
  if (CS) CS.setItem(k, v, (e) => e ? rej(e) : res());
  else { try { localStorage.setItem(k, v); } catch(e) {} res(); }
});
const sKeys = () => new Promise(res => {
  if (CS) CS.getKeys((e, k) => res(e ? [] : (k || [])));
  else { const ks = []; try { for (let i = 0; i < localStorage.length; i++) ks.push(localStorage.key(i)); } catch(e) {} res(ks); }
});
const parse = (s, def) => { try { return s ? JSON.parse(s) : def; } catch(e) { return def; } };
const dayKeys = async () => (await sKeys()).filter(k => /^d_\d{4}-\d\d-\d\d$/.test(k)).map(k => k.slice(2)).sort();

/* ---------- Утилиты ---------- */
const num = v => { if (v === '' || v == null) return null;
  const n = parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isNaN(n) ? null : n; };
const fmt = n => (Math.round(n*100)/100).toLocaleString('ru-RU',{maximumFractionDigits:2});
const som = n => `${fmt(n)} сом`;
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const TODAY = iso(new Date());
const D = day => new Date(day + 'T12:00:00');
const shift = (day, n) => { const d = D(day); d.setDate(d.getDate() + n); return iso(d); };
const dateRu = day => D(day).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const dateShort = day => D(day).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'});
const weekday = day => D(day).toLocaleDateString('ru-RU',{weekday:'long'});
const isFriday = day => D(day).getDay() === 5;
const priceOn = (pr, day) => (isFriday(day) && pr[2] != null) ? pr[2] : pr[1];
let statusTimer;
function setStatus(t){ $('status').textContent = t; clearTimeout(statusTimer); if (t === 'Сохранено') statusTimer = setTimeout(() => $('status').textContent = '', 1500); }
function alertMsg(m){ tg && tg.showAlert ? tg.showAlert(m) : alert(m); }

/* ---------- Состояние ---------- */
let products = [];          // [название, цена, цена в пятницу?, себестоимость?]
let curDay = TODAY;
let prevDay = null, prevRec = {s:{}}, curRec = {s:{}, i:{}, c:null, e:[]}, lastExp = [];
let rows = [], dayRendered = false, dirty = false, saveTimer = null;

async function loadProducts(){ products = parse((await sGet(['products'])).products, []); }

async function loadDay(){
  setStatus('Загрузка…');
  const earlier = (await dayKeys()).filter(d => d < curDay).reverse().slice(0, 14);
  const got = await sGetMany(['d_' + curDay, ...earlier.map(d => 'd_' + d)]);
  curRec = Object.assign({s:{}, i:{}, c:null, e:[]}, parse(got['d_' + curDay], {}));
  prevDay = null; prevRec = {s:{}}; lastExp = [];
  for (const d of earlier) {
    const r = parse(got['d_' + d], null); if (!r) continue;
    if (!prevDay && r.s && Object.keys(r.s).length) { prevDay = d; prevRec = r; }
    if (!lastExp.length && r.e && r.e.length) lastExp = r.e;
  }
  setStatus('');
  renderHeader();
}

function renderHeader(){
  $('dateTitle').textContent = curDay === TODAY ? `Сегодня, ${dateRu(curDay)}` : `${dateRu(curDay)}, ${weekday(curDay)}`;
  let sub = prevDay ? `Вчерашний остаток от ${dateRu(prevDay)}` : 'Первый день: остаток станет базой для следующего';
  if (isFriday(curDay) && products.some(p => p[2] != null)) sub += '. Пятница: цены со скидкой';
  $('dateSub').textContent = sub;
  $('nextBtn').disabled = curDay >= TODAY;
}

/* ---------- Вкладка «Остатки» ---------- */
const cashInput = $('cash');
function renderDay(){
  const list = $('dayList'); list.innerHTML = ''; rows = [];
  cashInput.value = curRec.c == null ? '' : String(curRec.c);
  if (!products.length) {
    const e = el('div','empty','Товаров пока нет.');
    const b = el('button','linkbtn','Добавить товары'); b.onclick = () => showTab('prod');
    e.append(el('br'), b); list.appendChild(e);
  }
  products.forEach(pr => {
    const name = pr[0], price = priceOn(pr, curDay), disc = price !== pr[1];
    const it = el('div','item');
    const top = el('div','top'); top.append(el('span','name',name), el('span','price',`${som(price)}${disc ? ' (пятница)' : ''}`));
    const fields = el('div','fields');
    const fPrev = el('div','f'); fPrev.append(el('label',null,'Было'), el('div','ro', fmt(prevRec.s[name] || 0)));
    const mk = (lbl, val) => { const f = el('div','f'); const id = 'i' + Math.random().toString(36).slice(2);
      const l = el('label',null,lbl); l.htmlFor = id; const i = el('input'); i.id = id; i.inputMode = 'decimal';
      i.autocomplete = 'off'; i.placeholder = lbl === 'Приход' ? '0' : '—';
      if (val != null) i.value = String(val);
      i.addEventListener('input', () => { recalc(); saveDaySoon(); }); f.append(l, i); return [f, i]; };
    const [fInc, iInc] = mk('Приход', curRec.i[name]);
    const [fSt, iSt] = mk('Остаток', curRec.s[name]);
    fields.append(fPrev, fInc, fSt);
    const res = el('div','res');
    it.append(top, fields, res); list.appendChild(it);
    rows.push({name, price, iInc, iSt, res});
  });
  renderExpenses(curRec.e || []);
  dayRendered = true;
  recalc();
}
cashInput.addEventListener('input', () => { recalc(); saveDaySoon(); });

function recalc(){
  let expected = 0, missing = 0;
  rows.forEach(r => {
    const p = prevRec.s[r.name] || 0, i = num(r.iInc.value) || 0, s = num(r.iSt.value);
    r.res.className = 'res'; r.res.innerHTML = '';
    if (s == null) { missing++; r.res.textContent = 'Введите остаток'; return; }
    if (!prevDay) { r.res.textContent = 'Стартовый остаток записан. Продажи посчитаются завтра'; return; }
    const sold = p + i - s, sum = sold * r.price; expected += sum;
    r.res.append('Продано ', el('b',null,fmt(sold)), ' на ', el('b',null,som(sum)));
    if (sold < 0) { r.res.classList.add('neg'); r.res.append(' — остаток больше, чем было. Проверьте приход'); }
  });
  $('expected').textContent = som(expected);
  const cash = num(cashInput.value), total = $('total'), lbl = $('diffLbl'), big = $('diff');
  if (!prevDay) { total.className = 'total wait'; lbl.textContent = ''; big.textContent = 'Первый день: расчёт начнётся завтра'; }
  else if (cash == null) { total.className = 'total wait'; lbl.textContent = ''; big.textContent = 'Введите сумму из кассы'; }
  else {
    const d = Math.round((expected - cash)*100)/100;
    if (d > 0)      { total.className = 'total bad';  lbl.textContent = 'Не хватает'; big.textContent = som(d); }
    else if (d < 0) { total.className = 'total warn'; lbl.textContent = 'Лишние';     big.textContent = som(-d); }
    else            { total.className = 'total good'; lbl.textContent = 'Всё сходится'; big.textContent = '0 сом'; }
  }
  const miss = $('miss');
  miss.hidden = !missing || !rows.length;
  miss.textContent = missing ? `Не введён остаток по ${missing} из ${rows.length} товаров — они не попадут в расчёт` : '';
}

/* Расходы */
const expList = $('expList');
function addExpRow(name = '', amt = ''){
  const row = el('div','erow');
  const n = el('input'); n.placeholder = 'Например, зарплата'; n.value = name; n.setAttribute('aria-label','Расход');
  const a = el('input'); a.inputMode = 'decimal'; a.placeholder = 'Сумма'; a.value = amt === '' ? '' : String(amt); a.setAttribute('aria-label','Сумма расхода');
  const d = el('button','del','×'); d.setAttribute('aria-label','Удалить расход');
  d.onclick = () => { row.remove(); if (!expList.children.length) addExpRow(); saveDaySoon(); };
  [n, a].forEach(i => i.addEventListener('input', saveDaySoon));
  row.append(n, a, d); expList.appendChild(row); return n;
}
function renderExpenses(list){
  expList.innerHTML = '';
  list.forEach(([n, a]) => addExpRow(n, a));
  if (!list.length) addExpRow();
  $('copyExp').hidden = !(lastExp.length && !list.length);
}
$('addExp').onclick = () => addExpRow().focus();
$('copyExp').onclick = () => { renderExpenses(lastExp); $('copyExp').hidden = true; saveDaySoon(); };

function collectRec(){
  if (!dayRendered) return curRec;
  const rec = {s:{}, i:{}, c:num(cashInput.value), e:[]};
  rows.forEach(r => { const s = num(r.iSt.value), i = num(r.iInc.value);
    if (s != null) rec.s[r.name] = s; if (i) rec.i[r.name] = i; });
  // сохраняем остатки товаров, которых сейчас нет на экране
  Object.keys(curRec.s || {}).forEach(k => { if (!rows.some(r => r.name === k)) rec.s[k] = curRec.s[k]; });
  for (const row of expList.children) {
    const [n, a] = row.querySelectorAll('input'); const amt = num(a.value);
    if (amt != null && amt > 0) rec.e.push([n.value.trim() || 'Расход', amt]);
  }
  return rec;
}
async function saveDay(){
  clearTimeout(saveTimer); dirty = false;
  const rec = collectRec(), str = JSON.stringify(rec);
  if (str.length > 4000) { setStatus('Слишком много данных за день — не сохранено'); return; }
  try { await sSet('d_' + curDay, str); curRec = rec; setStatus('Сохранено'); }
  catch(e) { setStatus('Не удалось сохранить, проверьте интернет'); }
}
function saveDaySoon(){ dirty = true; setStatus('Сохраняю…'); clearTimeout(saveTimer); saveTimer = setTimeout(saveDay, 700); }

/* ---------- Расчёт одного дня ---------- */
function computeDay(day, rec, prev){
  const e = rec.e || [];
  const r = { day, start: !prev, items: [], missing: [], noCost: [], expected: 0, profit: 0,
    cash: rec.c == null ? null : rec.c, exp: e.reduce((a, x) => a + (+x[1] || 0), 0), expList: e };
  products.forEach(pr => {
    const name = pr[0], price = priceOn(pr, day), cost = pr[3], s = (rec.s || {})[name];
    if (s == null) { r.missing.push(name); return; }
    if (!prev) { r.items.push({name, start: true, s}); return; }
    const p = prev.s[name] || 0, i = (rec.i || {})[name] || 0, sold = p + i - s, sum = sold * price;
    let pf = null;
    if (cost != null) { pf = sold * (price - cost); r.profit += pf; } else if (sold) r.noCost.push(name);
    r.expected += sum;
    r.items.push({name, p, i, s, sold, sum, price, pf});
  });
  r.short = (!r.start && r.cash != null) ? Math.round((r.expected - r.cash)*100)/100 : 0;
  r.net = r.profit - r.exp;
  return r;
}

/* ---------- Отчёт ---------- */
let period = 'day', reportText = '', repToken = 0;
const hasCosts = () => products.some(pr => pr[3] != null);
const line = (label, value, cls) => { const r = el('div','rrow' + (cls ? ' ' + cls : '')); r.append(el('span',null,label), el('b',null,value)); return r; };
const bigRow = (label, value, cls) => { const t = el('div','total ' + cls); t.append(el('span','lbl',label), el('span','big',value)); return t; };

function totalsCard(t, lines){
  // t: {expected, cash, short, profit, exp, net, expList?}
  const card = el('div','card');
  card.append(line('Выручка (должно быть)', som(t.expected)));
  card.append(line('В кассе', t.cash == null ? 'не введено' : som(t.cash)));
  lines.push(`Выручка (должно быть): ${som(t.expected)}`, `В кассе: ${t.cash == null ? 'не введено' : som(t.cash)}`);
  if (t.cash != null) {
    const d = t.short;
    const txt = d > 0 ? 'Не хватает' : d < 0 ? 'Лишние' : 'Всё сходится';
    card.append(bigRow(txt, som(Math.abs(d)), d > 0 ? 'bad' : d < 0 ? 'warn' : 'good'));
    lines.push(d === 0 ? 'Всё сходится' : `${txt}: ${som(Math.abs(d))}`);
  }
  if (hasCosts() || t.exp) {
    const c2 = el('div','total'); c2.style.display = 'block';
    c2.append(line('Прибыль до расходов', som(t.profit)));
    c2.append(line('Расходы', t.exp ? '− ' + som(t.exp) : '0 сом'));
    (t.expList || []).forEach(([n, a]) => c2.append(line(n, som(a), 'sub')));
    card.append(c2);
    card.append(bigRow('Чистая прибыль', som(t.net), t.net < 0 ? 'bad' : 'good'));
    lines.push('', `Прибыль до расходов: ${som(t.profit)}`, `Расходы: ${som(t.exp)}`);
    (t.expList || []).forEach(([n, a]) => lines.push(`  ${n}: ${som(a)}`));
    lines.push(`Чистая прибыль: ${som(t.net)}`);
    if (t.short > 0) {
      const real = t.net - t.short;
      card.append(line('С учётом недостачи', som(real), real < 0 ? 'neg' : ''));
      lines.push(`С учётом недостачи: ${som(real)}`);
    }
  }
  return card;
}

async function renderReport(){
  if (dirty) await saveDay();
  const token = ++repToken;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-selected', b.dataset.p === period));
  const body = $('repBody'); body.innerHTML = '';
  reportText = '';
  if (!products.length) { body.appendChild(el('div','empty','Сначала добавьте товары')); $('repHead').textContent = ''; return; }
  if (period === 'day') renderDayReport(body); else await renderPeriod(body, token);
}

function renderDayReport(body){
  const r = computeDay(curDay, collectRec(), prevDay ? prevRec : null);
  $('repHead').textContent = `Отчёт за ${dateRu(curDay)}`;
  const lines = [`Отчёт за ${dateRu(curDay)}`, ''];
  if (r.start) {
    const c = el('div','card'); c.append(el('div','rep-line','Это первый день: записаны стартовые остатки. Завтра здесь появятся продажи и прибыль.'));
    body.appendChild(c); lines.push('Первый день — стартовые остатки');
  } else {
    body.appendChild(totalsCard(r, lines));
  }
  const list = el('div','list');
  lines.push('', 'По товарам:');
  r.items.forEach(it => {
    const d = el('div','rep-item'), top = el('div','top');
    if (it.start) {
      top.append(el('span','name',it.name), el('span','price','старт'));
      d.append(top, el('div','rep-line',`Остаток: ${fmt(it.s)}`));
      lines.push(`${it.name}: остаток ${fmt(it.s)}`);
    } else {
      top.append(el('span','name',it.name), el('span','rep-sum',som(it.sum)));
      const inc = it.i ? ` + приход ${fmt(it.i)}` : '';
      const l1 = `Было ${fmt(it.p)}${inc}, осталось ${fmt(it.s)}`;
      const l2 = `Продано ${fmt(it.sold)} × ${fmt(it.price)} = ${som(it.sum)}`;
      d.append(top, el('div','rep-line',l1), el('div','rep-line' + (it.sold < 0 ? ' neg' : ''), l2));
      lines.push(it.name, `  ${l1}`, `  ${l2}`);
      if (it.pf != null) { d.append(el('div','rep-line ' + (it.pf < 0 ? 'neg' : 'profit'), `Прибыль: ${som(it.pf)}`)); lines.push(`  Прибыль: ${som(it.pf)}`); }
    }
    list.appendChild(d);
  });
  r.missing.forEach(n => { const d = el('div','rep-item'), top = el('div','top');
    top.append(el('span','name',n), el('span','price','нет остатка')); d.append(top); list.appendChild(d); });
  body.appendChild(list);
  if (r.missing.length) lines.push('', `Нет остатка: ${r.missing.join(', ')}`);
  if (!r.start && r.noCost.length) { body.appendChild(el('div','note',`Нет себестоимости, не вошли в прибыль: ${r.noCost.join(', ')}`)); }
  reportText = lines.join('\n');
}

async function renderPeriod(body, token){
  let start, end, title;
  if (period === 'week') {
    start = shift(curDay, -((D(curDay).getDay() + 6) % 7)); end = shift(start, 6);
    title = `Неделя: ${dateRu(start)} – ${dateRu(end)}`;
  } else {
    start = curDay.slice(0, 8) + '01';
    const d = D(start); end = iso(new Date(d.getFullYear(), d.getMonth() + 1, 0, 12));
    const m = d.toLocaleDateString('ru-RU',{month:'long', year:'numeric'}).replace(' г.','');
    title = m.charAt(0).toUpperCase() + m.slice(1);
  }
  if (end > TODAY) end = TODAY;
  $('repHead').textContent = title;
  body.appendChild(el('div','loading','Считаю…'));
  const all = await dayKeys();
  const inRange = all.filter(d => d >= start && d <= end);
  const before = all.filter(d => d < start).reverse().slice(0, 14);
  const got = await sGetMany([...inRange, ...before].map(d => 'd_' + d));
  if (token !== repToken) return;
  body.innerHTML = '';

  let prev = null;
  for (const d of before) { const r = parse(got['d_' + d], null); if (r && r.s && Object.keys(r.s).length) { prev = r; break; } }
  const T = {expected:0, cash:0, cashSet:false, short:0, profit:0, exp:0, net:0, expList:[]};
  const byProd = {}, days = [], expBy = {};
  for (const d of inRange) {
    const rec = parse(got['d_' + d], null); if (!rec) continue;
    const r = computeDay(d, rec, prev);
    if (rec.s && Object.keys(rec.s).length) prev = rec;
    T.exp += r.exp; r.expList.forEach(([n, a]) => expBy[n] = (expBy[n] || 0) + a);
    if (!r.start) {
      T.expected += r.expected; T.profit += r.profit; T.short += r.short;
      if (r.cash != null) { T.cash += r.cash; T.cashSet = true; }
      r.items.forEach(it => { const b = byProd[it.name] || (byProd[it.name] = {sold:0, sum:0, pf:0, hasPf:false});
        b.sold += it.sold; b.sum += it.sum; if (it.pf != null) { b.pf += it.pf; b.hasPf = true; } });
    }
    days.push(r);
  }
  T.net = T.profit - T.exp;
  T.cash = T.cashSet ? T.cash : null;
  T.short = Math.round(T.short * 100) / 100;
  T.expList = Object.entries(expBy);

  const lines = [title, ''];
  if (!days.length) { body.appendChild(el('div','empty','За этот период пока нет записей')); reportText = ''; return; }
  body.appendChild(totalsCard(T, lines));

  body.appendChild(el('div','h2','По дням'));
  const dl = el('div','list'); lines.push('', 'По дням:');
  days.forEach(r => {
    const it = el('div','rep-item'), top = el('div','top');
    if (r.start) {
      top.append(el('span','name',dateShort(r.day)), el('span','price','старт'));
      it.append(top); if (r.exp) it.append(el('div','rep-line',`Расходы ${som(r.exp)}`));
      lines.push(`${dateShort(r.day)}: стартовые остатки`);
    } else {
      top.append(el('span','name',dateShort(r.day)), el('span','rep-sum ' + (r.net < 0 ? 'neg' : ''), som(r.net)));
      const l1 = `Выручка ${som(r.expected)}, расходы ${som(r.exp)}`;
      const l2 = r.cash == null ? 'Касса не введена' : r.short > 0 ? `Недостача ${som(r.short)}` : r.short < 0 ? `Лишние ${som(-r.short)}` : 'Касса сходится';
      it.append(top, el('div','rep-line',l1), el('div','rep-line' + (r.short > 0 ? ' neg' : ''), l2));
      lines.push(`${dateShort(r.day)}: чистая ${som(r.net)}, ${l1.toLowerCase()}, ${l2.toLowerCase()}`);
    }
    dl.appendChild(it);
  });
  body.appendChild(dl);

  const names = Object.keys(byProd);
  if (names.length) {
    body.appendChild(el('div','h2','По товарам'));
    const pl = el('div','list'); lines.push('', 'По товарам:');
    names.forEach(n => { const b = byProd[n], it = el('div','rep-item'), top = el('div','top');
      top.append(el('span','name',n), el('span','rep-sum',som(b.sum)));
      it.append(top, el('div','rep-line',`Продано ${fmt(b.sold)}`));
      if (b.hasPf) it.append(el('div','rep-line profit',`Прибыль ${som(b.pf)}`));
      pl.appendChild(it);
      lines.push(`${n}: продано ${fmt(b.sold)} на ${som(b.sum)}${b.hasPf ? `, прибыль ${som(b.pf)}` : ''}`);
    });
    body.appendChild(pl);
  }
  body.appendChild(el('div','note','Суммы считаются по текущим ценам и себестоимости из вкладки «Товары».'));
  reportText = lines.join('\n');
}

document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { period = b.dataset.p; renderReport(); });
$('shareBtn').onclick = () => {
  if (!reportText) return;
  const url = 'https://t.me/share/url?url=' + encodeURIComponent(reportText);
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
};
$('copyBtn').onclick = async () => {
  if (!reportText) return;
  try { await navigator.clipboard.writeText(reportText); alertMsg('Отчёт скопирован'); }
  catch(e) { alertMsg('Не удалось скопировать'); }
};

/* ---------- Вкладка «Товары» ---------- */
const prodList = $('prodList');
let prodTimer;
function addProdRow(name = '', price = '', fri = null, cost = null){
  const row = el('div','prow'), top = el('div','prow-top');
  const n = el('input'); n.placeholder = 'Название, например Крылышки'; n.value = name; n.setAttribute('aria-label','Название'); n.dataset.k = 'n';
  const d = el('button','del','×'); d.setAttribute('aria-label','Удалить товар');
  d.onclick = () => { row.remove(); saveProductsSoon(); };
  top.append(n, d);
  const fields = el('div','prow-fields');
  const mk = (k, lbl, val, ph) => { const w = el('div'); const id = 'p' + Math.random().toString(36).slice(2);
    const l = el('label', null, lbl); l.htmlFor = id; const i = el('input'); i.id = id; i.inputMode = 'decimal';
    i.placeholder = ph; i.value = (val == null || val === '') ? '' : String(val); i.dataset.k = k; w.append(l, i); fields.appendChild(w); };
  mk('p', 'Цена', price, '0'); mk('f', 'В пятницу', fri, '—'); mk('c', 'Себестоимость', cost, '—');
  row.append(top, fields);
  row.querySelectorAll('input').forEach(i => i.addEventListener('input', saveProductsSoon));
  prodList.appendChild(row); return n;
}
function renderProducts(){ prodList.innerHTML = ''; products.forEach(([n, p, f, c]) => addProdRow(n, p, f, c)); if (!products.length) addProdRow(); }
$('addProd').onclick = () => addProdRow().focus();

async function saveProducts(){
  const items = [], seen = new Set();
  for (const row of prodList.querySelectorAll('.prow')) {
    const g = k => row.querySelector(`input[data-k="${k}"]`).value;
    const name = g('n').trim(), price = num(g('p')), fri = num(g('f')), cost = num(g('c'));
    if (!name || price == null || price < 0) continue;
    const key = name.toLowerCase(); if (seen.has(key)) continue;
    seen.add(key);
    const it = [name, price, fri != null && fri >= 0 ? fri : null, cost != null && cost >= 0 ? cost : null];
    while (it.length > 2 && it[it.length - 1] == null) it.pop();
    items.push(it);
  }
  const str = JSON.stringify(items);
  if (str.length > 4000) { setStatus('Слишком много товаров — не сохранено'); return; }
  try { await sSet('products', str); products = items; setStatus('Сохранено'); }
  catch(e) { setStatus('Не удалось сохранить, проверьте интернет'); }
}
function saveProductsSoon(){ setStatus('Сохраняю…'); clearTimeout(prodTimer); prodTimer = setTimeout(saveProducts, 700); }

/* ---------- Навигация ---------- */
let current = 'day';
async function showTab(t){
  if (current === 'day' && t !== 'day' && dirty) await saveDay();
  current = t;
  $('day').hidden = t !== 'day'; $('prod').hidden = t !== 'prod'; $('rep').hidden = t !== 'rep';
  $('receipt').hidden = t !== 'day';
  document.body.classList.toggle('no-receipt', t !== 'day');
  $('tab-day').setAttribute('aria-selected', t === 'day');
  $('tab-rep').setAttribute('aria-selected', t === 'rep');
  $('tab-prod').setAttribute('aria-selected', t === 'prod');
  if (t === 'day') { renderHeader(); renderDay(); }
  else if (t === 'rep') renderReport();
  else renderProducts();
}
$('tab-day').onclick = () => showTab('day');
$('tab-rep').onclick = () => showTab('rep');
$('tab-prod').onclick = () => showTab('prod');
async function goDay(n){
  if (dirty) await saveDay();
  const nd = shift(curDay, n); if (nd > TODAY) return;
  curDay = nd; dayRendered = false; rows = [];
  await loadDay(); showTab(current);
}
$('prevBtn').onclick = () => goDay(-1);
$('nextBtn').onclick = () => goDay(1);

(async () => {
  await loadProducts();
  await loadDay();
  showTab(products.length ? 'day' : 'prod');
})();
</script>
