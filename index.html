<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учёт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --sec:var(--tg-theme-secondary-bg-color,#eff1f4);
  --text:var(--tg-theme-text-color,#14171a);
  --hint:var(--tg-theme-hint-color,#8a9099);
  --accent:var(--tg-theme-button-color,#2f7de1);
  --line:color-mix(in srgb,var(--hint) 22%,transparent);
  --bad:#e5484d; --good:#2f9e66; --warn:#c98200;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sec);color:var(--text);
  font:16px/1.4 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:240px}
body.no-receipt{padding-bottom:40px}
header{padding:14px 16px 4px;display:flex;align-items:center;gap:8px}
.nav{border:0;background:var(--bg);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;flex:none}
.nav:disabled{opacity:.3}
.nav:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent)}
.dt{flex:1;text-align:center}
.dt b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em}
.dt span{font-size:13px;color:var(--hint)}
.status{text-align:center;font-size:12px;color:var(--hint);height:16px}
.tabs{display:flex;gap:4px;margin:8px 16px 12px;background:var(--bg);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;color:var(--hint);font:inherit;font-weight:600;padding:8px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--sec);color:var(--text)}
.list{background:var(--bg);margin:0 16px;border-radius:14px;overflow:hidden}
.item{padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:600;overflow-wrap:anywhere}
.price{color:var(--hint);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.f label{display:block;font-size:12px;color:var(--hint);margin-bottom:3px}
input{width:100%;font:inherit;font-variant-numeric:tabular-nums;padding:8px 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--sec);color:var(--text);min-width:0}
input:focus-visible{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.ro{padding:8px 0;font-variant-numeric:tabular-nums}
.res{margin-top:8px;font-size:14px;color:var(--hint);font-variant-numeric:tabular-nums}
.res b{color:var(--text);font-weight:600}
.res.neg,.res.neg b{color:var(--bad)}
.empty{padding:22px 16px;text-align:center;color:var(--hint)}
.linkbtn{margin-top:10px;border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:6px}
.prow{display:grid;grid-template-columns:1fr 74px 74px 32px;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.del{border:0;background:none;color:var(--hint);font-size:22px;line-height:1;cursor:pointer;border-radius:8px;height:36px}
.phead{display:grid;grid-template-columns:1fr 74px 74px 32px;gap:8px;padding:0 30px 6px;line-height:1.2;font-size:12px;color:var(--hint)}
.addwrap{margin:6px 16px}
.note{margin:10px 16px;font-size:13px;color:var(--hint)}
.receipt{position:fixed;left:0;right:0;bottom:0;background:var(--bg);
  padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px));
  filter:drop-shadow(0 -3px 8px rgba(0,0,0,.08))}
.receipt::before{content:"";position:absolute;left:0;right:0;top:-7px;height:7px;
  background:conic-gradient(from -45deg at bottom,var(--bg) 90deg,transparent 0) 50%/14px 100%}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.rrow+.rrow{margin-top:8px}
.rrow input{max-width:150px;text-align:right}
.total{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.total .lbl{font-weight:600}
.total .big{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.total.bad .big,.total.bad .lbl{color:var(--bad)}
.total.good .big,.total.good .lbl{color:var(--good)}
.total.warn .big,.total.warn .lbl{color:var(--warn)}
.total.wait .big{font-size:15px;font-weight:500;color:var(--hint)}
.miss{font-size:13px;color:var(--warn);margin-top:6px}
.loading{padding:40px;text-align:center;color:var(--hint)}
.rep-item{padding:12px 14px;border-bottom:1px solid var(--line)}
.rep-item:last-child{border-bottom:0}
.rep-line{font-size:14px;color:var(--hint);margin-top:2px;font-variant-numeric:tabular-nums}
.rep-sum{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.rep-total{background:var(--bg);margin:12px 16px 0;border-radius:14px;padding:14px}
.rep-total .total{margin-top:10px}
.share{display:flex;gap:8px;margin:12px 16px}
.share button{flex:1;padding:12px;border:0;border-radius:12px;background:var(--accent);color:var(--tg-theme-button-text-color,#fff);font:inherit;font-weight:600;cursor:pointer}
.share button.alt{background:var(--bg);color:var(--accent)}
.share button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
</style>
</head>
<body>
<header>
  <button class="nav" id="prevBtn" aria-label="Предыдущий день">‹</button>
  <div class="dt"><b id="dateTitle">…</b><span id="dateSub"></span></div>
  <button class="nav" id="nextBtn" aria-label="Следующий день">›</button>
</header>
<div class="status" id="status" aria-live="polite"></div>

<div class="tabs" role="tablist">
  <button role="tab" id="tab-day" aria-selected="true">Остатки</button>
  <button role="tab" id="tab-rep" aria-selected="false">Отчёт</button>
  <button role="tab" id="tab-prod" aria-selected="false">Товары</button>
</div>

<section id="day"><div class="list" id="dayList"><div class="loading">Загрузка…</div></div></section>

<section id="rep" hidden>
  <div class="list" id="repList"></div>
  <div class="rep-total" id="repTotal"></div>
  <div class="share">
    <button id="shareBtn">Отправить в чат</button>
    <button class="alt" id="copyBtn">Скопировать</button>
  </div>
</section>

<section id="prod" hidden>
  <div class="phead"><span>Название</span><span>Цена за кг/шт</span><span>Цена в пятницу</span><span></span></div>
  <div class="list" id="prodList"></div>
  <div class="addwrap"><button class="linkbtn" id="addProd">+ Добавить товар</button></div>
  <p class="note">«Цена в пятницу» заполняйте только для товаров со скидкой, у остальных оставьте пустым. Изменения сохраняются сами. Если переименовать товар, его прошлые остатки не подтянутся.</p>
</section>

<div class="receipt" id="receipt">
  <div class="rrow"><span>Должно быть</span><b id="expected">0 сом</b></div>
  <div class="rrow"><label for="cash">В кассе по факту</label>
    <input id="cash" inputmode="decimal" placeholder="Сумма, сом" autocomplete="off"></div>
  <div class="total wait" id="total"><span class="lbl" id="diffLbl"></span><span class="big" id="diff">Введите сумму из кассы</span></div>
  <div class="miss" id="miss" hidden></div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ---------- Хранилище: облако Telegram, иначе память телефона ---------- */
const CS = (tg && tg.initData && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) ? tg.CloudStorage : null;
const sGet = keys => new Promise(res => {
  if (CS) CS.getItems(keys, (e, v) => res(e ? {} : (v || {})));
  else { const o = {}; keys.forEach(k => { try { o[k] = localStorage.getItem(k) || ''; } catch(e) { o[k] = ''; } }); res(o); }
});
const sSet = (k, v) => new Promise((res, rej) => {
  if (CS) CS.setItem(k, v, (e) => e ? rej(e) : res());
  else { try { localStorage.setItem(k, v); } catch(e) {} res(); }
});
const sKeys = () => new Promise(res => {
  if (CS) CS.getKeys((e, k) => res(e ? [] : (k || [])));
  else { const ks = []; try { for (let i = 0; i < localStorage.length; i++) ks.push(localStorage.key(i)); } catch(e) {} res(ks); }
});
const parse = (s, def) => { try { return s ? JSON.parse(s) : def; } catch(e) { return def; } };

/* ---------- Утилиты ---------- */
const num = v => { if (v === '' || v == null) return null;
  const n = parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isNaN(n) ? null : n; };
const fmt = n => (Math.round(n*100)/100).toLocaleString('ru-RU',{maximumFractionDigits:2});
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const TODAY = iso(new Date());
const shift = (day, n) => { const d = new Date(day + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const dateRu = day => new Date(day + 'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const weekday = day => new Date(day + 'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long'});
const statusEl = document.getElementById('status');
let statusTimer;
function setStatus(t){ statusEl.textContent = t; clearTimeout(statusTimer); if (t === 'Сохранено') statusTimer = setTimeout(() => statusEl.textContent = '', 1500); }
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ---------- Состояние ---------- */
let products = [];          // [название, цена, цена в пятницу?]
const isFriday = day => new Date(day + 'T12:00:00').getDay() === 5;
const effPrice = pr => (isFriday(curDay) && pr[2] != null) ? pr[2] : pr[1];          // [[название, цена]]
let curDay = TODAY;
let prevDay = null, prevRec = {s:{}}, curRec = {s:{}, i:{}, c:null};
const rows = [];

async function loadProducts(){ products = parse((await sGet(['products'])).products, []); }

async function loadDay(){
  setStatus('Загрузка…');
  const keys = (await sKeys()).filter(k => /^d_\d{4}-\d\d-\d\d$/.test(k)).map(k => k.slice(2));
  const earlier = keys.filter(d => d < curDay).sort().reverse().slice(0, 10);
  const want = ['d_' + curDay, ...earlier.map(d => 'd_' + d)];
  const got = await sGet(want);
  curRec = Object.assign({s:{}, i:{}, c:null}, parse(got['d_' + curDay], {}));
  prevDay = null; prevRec = {s:{}};
  for (const d of earlier) { const r = parse(got['d_' + d], null); if (r && r.s && Object.keys(r.s).length) { prevDay = d; prevRec = r; break; } }
  setStatus('');
  renderHeader(); renderDay();
}

function renderHeader(){
  document.getElementById('dateTitle').textContent = curDay === TODAY ? `Сегодня, ${dateRu(curDay)}` : `${dateRu(curDay)}, ${weekday(curDay)}`;
  document.getElementById('dateSub').textContent = prevDay
    ? `Вчерашний остаток от ${dateRu(prevDay)}`
    : 'Первый день: остаток станет базой для следующего';
  if (isFriday(curDay) && products.some(p => p[2] != null))
    document.getElementById('dateSub').textContent += '. Пятница: цены со скидкой';
  document.getElementById('nextBtn').disabled = curDay >= TODAY;
}

/* ---------- Вкладка «Остатки и касса» ---------- */
const dayList = document.getElementById('dayList');
const cashInput = document.getElementById('cash');

function renderDay(){
  dayList.innerHTML = ''; rows.length = 0;
  cashInput.value = curRec.c == null ? '' : String(curRec.c);
  if (!products.length) {
    const e = el('div','empty','Товаров пока нет.');
    const b = el('button','linkbtn','Добавить товары'); b.onclick = () => showTab('prod');
    e.append(el('br'), b); dayList.appendChild(e); recalc(); return;
  }
  products.forEach(pr => { const name = pr[0], price = effPrice(pr), disc = price !== pr[1];
    const it = el('div','item');
    const top = el('div','top'); top.append(el('span','name',name), el('span','price',`${fmt(price)} сом${disc ? ' (пятница)' : ''}`));
    const fields = el('div','fields');
    const fPrev = el('div','f'); fPrev.append(el("label",null,"Было"), el('div','ro', fmt(prevRec.s[name] || 0)));
    const mk = (lbl, val) => { const f = el('div','f'); const id = 'i' + Math.random().toString(36).slice(2);
      const l = el('label',null,lbl); l.htmlFor = id; const i = el('input'); i.id = id; i.inputMode = 'decimal';
      i.autocomplete = 'off'; i.placeholder = lbl === 'Приход' ? '0' : '—';
      if (val != null) i.value = String(val);
      i.addEventListener('input', () => { recalc(); saveDaySoon(); }); f.append(l, i); return [f, i]; };
    const [fInc, iInc] = mk('Приход', curRec.i[name]);
    const [fSt, iSt] = mk('Остаток', curRec.s[name]);
    fields.append(fPrev, fInc, fSt);
    const res = el('div','res');
    it.append(top, fields, res); dayList.appendChild(it);
    rows.push({name, price, iInc, iSt, res});
  });
  recalc();
}
cashInput.addEventListener('input', () => { recalc(); saveDaySoon(); });

function recalc(){
  let expected = 0, missing = 0;
  rows.forEach(r => {
    const p = prevRec.s[r.name] || 0, i = num(r.iInc.value) || 0, s = num(r.iSt.value);
    r.res.className = 'res'; r.res.innerHTML = '';
    if (s == null) { missing++; r.res.textContent = 'Введите остаток'; return; }
    if (!prevDay) { r.res.textContent = 'Стартовый остаток записан. Продажи посчитаются завтра'; return; }
    const sold = p + i - s, sum = sold * r.price; expected += sum;
    r.res.append('Продано ', el('b',null,fmt(sold)), ' на ', el('b',null,`${fmt(sum)} сом`));
    if (sold < 0) { r.res.classList.add('neg'); r.res.append(' — остаток больше, чем было. Проверьте приход'); }
  });
  document.getElementById('expected').textContent = `${fmt(expected)} сом`;
  const cash = num(cashInput.value), total = document.getElementById('total');
  const lbl = document.getElementById('diffLbl'), big = document.getElementById('diff');
  if (!prevDay) { total.className = 'total wait'; lbl.textContent = ''; big.textContent = 'Первый день: расчёт начнётся завтра'; }
  else if (cash == null) { total.className = 'total wait'; lbl.textContent = ''; big.textContent = 'Введите сумму из кассы'; }
  else {
    const d = Math.round((expected - cash)*100)/100;
    if (d > 0)      { total.className = 'total bad';  lbl.textContent = 'Не хватает'; big.textContent = `${fmt(d)} сом`; }
    else if (d < 0) { total.className = 'total warn'; lbl.textContent = 'Лишние';     big.textContent = `${fmt(-d)} сом`; }
    else            { total.className = 'total good'; lbl.textContent = 'Всё сходится'; big.textContent = '0 сом'; }
  }
  const miss = document.getElementById('miss');
  miss.hidden = !missing || !rows.length;
  miss.textContent = missing ? `Не введён остаток по ${missing} из ${rows.length} товаров — они не попадут в расчёт` : '';
}

async function saveDay(){
  const rec = {s:{}, i:{}, c:num(cashInput.value)};
  rows.forEach(r => { const s = num(r.iSt.value), i = num(r.iInc.value);
    if (s != null) rec.s[r.name] = s; if (i) rec.i[r.name] = i; });
  const str = JSON.stringify(rec);
  if (str.length > 4000) { setStatus('Слишком много товаров для одного дня — не сохранено'); return; }
  try { await sSet('d_' + curDay, str); curRec = rec; setStatus('Сохранено'); }
  catch(e) { setStatus('Не удалось сохранить, проверьте интернет'); }
}
const saveDaySoon = debounce(() => { setStatus('Сохраняю…'); saveDay(); }, 700);

/* ---------- Вкладка «Товары» ---------- */
const prodList = document.getElementById('prodList');
function addProdRow(name = '', price = '', fri = null){
  const row = el('div','prow');
  const n = el('input'); n.placeholder = 'Например, Кола 0,5'; n.value = name; n.setAttribute('aria-label','Название');
  const p = el('input'); p.inputMode = 'decimal'; p.placeholder = '0'; p.value = price === '' ? '' : String(price); p.setAttribute('aria-label','Цена');
  const f = el('input'); f.inputMode = 'decimal'; f.placeholder = '—'; f.value = fri == null ? '' : String(fri); f.setAttribute('aria-label','Цена в пятницу');
  const d = el('button','del','×'); d.setAttribute('aria-label','Удалить товар');
  d.onclick = () => { row.remove(); saveProductsSoon(); };
  [n, p, f].forEach(i => i.addEventListener('input', saveProductsSoon));
  row.append(n, p, f, d); prodList.appendChild(row); return n;
}
function renderProducts(){ prodList.innerHTML = ''; products.forEach(([n, p, f]) => addProdRow(n, p, f)); if (!products.length) addProdRow(); }
document.getElementById('addProd').onclick = () => addProdRow().focus();

async function saveProducts(){
  const items = [], seen = new Set();
  for (const row of prodList.querySelectorAll('.prow')) {
    const [n, p, f] = row.querySelectorAll('input'); const name = n.value.trim(), price = num(p.value), fri = num(f.value);
    if (!name || price == null || price < 0) continue;
    const key = name.toLowerCase(); if (seen.has(key)) continue;
    seen.add(key); items.push(fri != null && fri >= 0 ? [name, price, fri] : [name, price]);
  }
  const str = JSON.stringify(items);
  if (str.length > 4000) { setStatus('Слишком много товаров — не сохранено'); return; }
  try { await sSet('products', str); products = items; setStatus('Сохранено'); }
  catch(e) { setStatus('Не удалось сохранить, проверьте интернет'); }
}
const saveProductsSoon = debounce(() => { setStatus('Сохраняю…'); saveProducts(); }, 700);

/* ---------- Навигация ---------- */
/* ---------- Отчёт ---------- */
function currentRec(){
  if (!rows.length) return curRec;
  const rec = {s:{}, i:{}, c:num(cashInput.value)};
  rows.forEach(r => { const s = num(r.iSt.value), i = num(r.iInc.value);
    if (s != null) rec.s[r.name] = s; if (i) rec.i[r.name] = i; });
  return rec;
}
let reportText = '';
function renderReport(){
  const rec = currentRec();
  const list = document.getElementById('repList'), tot = document.getElementById('repTotal');
  list.innerHTML = ''; tot.innerHTML = '';
  const title = `Отчёт за ${dateRu(curDay)}`;
  const lines = [title, ''];
  if (!products.length) { list.appendChild(el('div','empty','Сначала добавьте товары')); reportText = ''; return; }
  let expected = 0, missing = [];
  products.forEach(pr => { const name = pr[0], price = effPrice(pr), disc = price !== pr[1];
    const it = el('div','rep-item');
    const top = el('div','top');
    const p = prevRec.s[name] || 0, i = rec.i[name] || 0, s = rec.s[name];
    if (s == null) {
      missing.push(name);
      top.append(el('span','name',name), el('span','price','нет остатка'));
      it.append(top); list.appendChild(it); return;
    }
    if (!prevDay) {
      top.append(el('span','name',name), el('span','price','старт'));
      it.append(top, el('div','rep-line',`Остаток: ${fmt(s)}`));
      lines.push(`${name}: остаток ${fmt(s)}`);
      list.appendChild(it); return;
    }
    const sold = p + i - s, sum = sold * price; expected += sum;
    top.append(el('span','name',name), el('span','rep-sum',`${fmt(sum)} сом`));
    const inc = i ? ` + приход ${fmt(i)}` : '';
    const l1 = `Было ${fmt(p)}${inc}, осталось ${fmt(s)}`;
    const l2 = `Продано ${fmt(sold)} × ${fmt(price)} = ${fmt(sum)} сом`;
    it.append(top, el('div','rep-line',l1), el('div','rep-line' + (sold < 0 ? ' res neg' : ''), l2));
    list.appendChild(it);
    lines.push(`${name}`, `  ${l1}`, `  ${l2}`);
  });

  if (!prevDay) {
    tot.append(el('div','rep-line','Это первый день. Завтра здесь появятся продажи и недостача.'));
    lines.push('', 'Первый день — стартовые остатки');
  } else {
    const r1 = el('div','rrow'); r1.append(el('span',null,'Должно быть'), el('b',null,`${fmt(expected)} сом`));
    const cash = rec.c;
    const r2 = el('div','rrow'); r2.append(el('span',null,'В кассе'), el('b',null, cash == null ? 'не введено' : `${fmt(cash)} сом`));
    tot.append(r1, r2);
    lines.push('', `Должно быть: ${fmt(expected)} сом`, `В кассе: ${cash == null ? 'не введено' : fmt(cash) + ' сом'}`);
    if (cash != null) {
      const d = Math.round((expected - cash)*100)/100;
      const t = el('div','total ' + (d > 0 ? 'bad' : d < 0 ? 'warn' : 'good'));
      const txt = d > 0 ? 'Не хватает' : d < 0 ? 'Лишние' : 'Всё сходится';
      t.append(el('span','lbl',txt), el('span','big',`${fmt(Math.abs(d))} сом`));
      tot.append(t);
      lines.push(d === 0 ? 'Всё сходится' : `${txt}: ${fmt(Math.abs(d))} сом`);
    }
  }
  if (missing.length) {
    tot.append(el('div','miss',`Нет остатка: ${missing.join(', ')}`));
    lines.push('', `Нет остатка: ${missing.join(', ')}`);
  }
  reportText = lines.join('\n');
}
document.getElementById('shareBtn').onclick = () => {
  if (!reportText) return;
  const url = 'https://t.me/share/url?url=' + encodeURIComponent(reportText);
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
};
document.getElementById('copyBtn').onclick = async () => {
  if (!reportText) return;
  try { await navigator.clipboard.writeText(reportText); alertMsg('Отчёт скопирован'); }
  catch(e) { alertMsg('Не удалось скопировать'); }
};
function alertMsg(m){ tg && tg.showAlert ? tg.showAlert(m) : alert(m); }

let current = 'day';
function showTab(t){
  current = t;
  document.getElementById('day').hidden = t !== 'day';
  document.getElementById('prod').hidden = t !== 'prod';
  document.getElementById('rep').hidden = t !== 'rep';
  document.getElementById('receipt').hidden = t !== 'day';
  document.body.classList.toggle('no-receipt', t !== 'day');
  document.getElementById('tab-day').setAttribute('aria-selected', t === 'day');
  document.getElementById('tab-prod').setAttribute('aria-selected', t === 'prod');
  document.getElementById('tab-rep').setAttribute('aria-selected', t === 'rep');
  if (t === 'day') renderDay(); else if (t === 'rep') renderReport(); else renderProducts();
}
document.getElementById('tab-day').onclick = () => showTab('day');
document.getElementById('tab-prod').onclick = () => showTab('prod');
document.getElementById('tab-rep').onclick = () => showTab('rep');
document.getElementById('prevBtn').onclick = async () => { curDay = shift(curDay, -1); await loadDay(); if (current !== 'day') showTab(current); };
document.getElementById('nextBtn').onclick = async () => { if (curDay < TODAY) { curDay = shift(curDay, 1); await loadDay(); if (current !== 'day') showTab(current); } };

(async () => {
  await loadProducts();
  await loadDay();
  showTab(products.length ? 'day' : 'prod');
})();
</script>
